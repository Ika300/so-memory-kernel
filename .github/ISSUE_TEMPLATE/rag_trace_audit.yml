name: RAG Trace Memory Audit
description: Request an audit of RAG retrieval traces using structural memory concepts.
title: "[RAG Trace Audit]: "
labels: ["rag-trace", "memory-review"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for RAG systems where you want to inspect retrieval history structurally.

        SO Memory Kernel does not replace retrieval or generation. It can help distinguish independent source evidence from repeated contextual exposure.

        Do not share private credentials, API keys, confidential customer data, or proprietary raw documents in a public issue.

  - type: textarea
    id: rag_pipeline
    attributes:
      label: Current RAG pipeline
      description: Briefly describe your retrieval and generation flow.
      placeholder: Query -> retriever -> top-k chunks -> reranker -> LLM...
    validations:
      required: true

  - type: textarea
    id: trace_fields
    attributes:
      label: Available trace fields
      description: What fields are available in your retrieval traces?
      placeholder: query_id, document_id, chunk_id, score, source, relation, timestamp...
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: What do you want to find out?
      description: What do you want structural memory to reveal?
      placeholder: Whether the same source is repeated, whether independent evidence exists, whether certain retrieval patterns return...
    validations:
      required: true

  - type: textarea
    id: sample_shape
    attributes:
      label: Sanitized sample shape
      description: Optional. Provide a redacted or synthetic example of the trace format.
      placeholder: Do not include confidential raw text.
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I have not included private credentials, API keys, confidential customer data, or proprietary raw documents.
          required: true
